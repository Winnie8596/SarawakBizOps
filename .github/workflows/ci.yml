name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SarawakBizOps.sln
      - name: Build
        run: dotnet build SarawakBizOps.sln --configuration Release --no-restore
      # Integration tests start a real SQL Server container via Testcontainers;
      # the ubuntu runner already provides Docker.
      - name: Test
        run: dotnet test SarawakBizOps.sln --configuration Release --no-build

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SarawakBizOps.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/SarawakBizOps.Web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Proves the one-command Docker setup on every push: build both images, bring the stack up,
  # then sign in through the web container the way a browser would.
  compose-smoke:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Bake builds both images with GitHub Actions layer caching and loads them into the local
      # daemon under the names docker-compose.yml expects, so `up --no-build` reuses them.
      - uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 240
      - name: Smoke test
        run: bash scripts/compose-smoke.sh
      - name: Dump container logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
