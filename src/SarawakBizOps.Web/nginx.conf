server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Room for the photo and signature uploads added in later phases (~8 MB photos).
    client_max_body_size 10m;

    # The API is only reachable through this proxy, so the browser sees a single origin (no CORS).
    # Docker's embedded DNS plus a variable makes nginx look the API up per request, so it starts
    # even before the API is up and follows the API container if it is recreated.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (React Router) fall back to the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
